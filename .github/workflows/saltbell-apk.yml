name: Saltbell APK

on:
  push:
    branches: ['claude/**']
    paths: ['saltbell-android/**', '.github/workflows/saltbell-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: saltbell-android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle --no-daemon :app:assembleRelease
      - name: Rename
        run: cp saltbell-android/app/build/outputs/apk/release/app-release.apk Saltbell.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Saltbell-apk
          path: Saltbell.apk
          compression-level: 0
