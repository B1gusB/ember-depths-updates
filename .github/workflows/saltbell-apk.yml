name: Saltbell APK

on:
  push:
    branches: ['claude/**']
    paths: ['saltbell-android/**', '.github/workflows/saltbell-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: saltbell-android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle --no-daemon :app:assembleRelease
      - name: Rename
        run: cp saltbell-android/app/build/outputs/apk/release/app-release.apk Saltbell.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Saltbell-apk
          path: Saltbell.apk
          compression-level: 0
      - name: Commit the APK to the branch (so it can be downloaded directly)
        run: |
          mkdir -p saltbell-android/dist
          cp Saltbell.apk saltbell-android/dist/Saltbell.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add saltbell-android/dist/Saltbell.apk
          git commit -m "Saltbell.apk built from ${GITHUB_SHA::7}" || exit 0
          git push
